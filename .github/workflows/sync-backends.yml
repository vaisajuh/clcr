# Weekly: copy newer driver files from viactl, caselight and logiled into
# clcr/backends/ and open (or update) a pull request with the changes.
# Run it right away from the Actions tab with "Run workflow".
name: Sync bundled drivers

on:
  schedule:
    - cron: "0 3 * * 1"   # Mondays 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-backends

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      BRANCH: sync/backends
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Copy newer upstream files
        id: sync
        run: python scripts/sync_backends.py --body "$RUNNER_TEMP/body.md"

      - name: Run tests
        id: tests
        if: steps.sync.outputs.changed == 'true'
        continue-on-error: true
        run: python -m unittest discover -s tests -v

      - name: Open or update pull request
        if: steps.sync.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.sync.outputs.title }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ "$TESTS" = "success" ]; then
            echo "**Tests:** ✅ passed with the updated drivers." >> "$RUNNER_TEMP/body.md"
          else
            TITLE="[tests failing] $TITLE"
            echo "**Tests:** ❌ failed with the updated drivers. See the [workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) and fix clcr on this branch before merging." >> "$RUNNER_TEMP/body.md"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr edit "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1
